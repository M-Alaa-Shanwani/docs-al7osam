name: Deploy Docs Hub
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-manifest.mjs
      - run: touch .nojekyll
      - name: Commit repaired docs.json
        run: |
          git config user.name "docs-hub-bot"
          git config user.email "docs-hub-bot@users.noreply.github.com"
          git add docs.json .nojekyll
          if git diff --cached --quiet; then
            echo "unchanged"
          else
            git commit -m "docs: rebuild manifest from docs/ folder"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
